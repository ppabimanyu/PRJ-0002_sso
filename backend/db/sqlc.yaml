version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "../internal/repository/sqlcgen"
        sql_package: "pgx/v5"
        emit_interface: false
        emit_json_tags: false
        overrides:
          - db_type: "citext"
            go_type: "string"
